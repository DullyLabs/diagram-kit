<style>
:root{color-scheme:light dark;--paper:#f5f2ea;--card:#fdfbf5;--ink:#272b26;--muted:#656a60;--line:#cecfc3;--accent:#2f6452;--wash:#e6ede4;--shadow:#272b2622;--serif:Georgia,serif;--sans:system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--gap:16px;--pad:20px;--radius:2px;--fast:.18s;--slow:.5s;
--green-e:#2f6452;--green-t:#e6ede4;--blue-e:#2b5f8a;--blue-t:#e3ecf3;--plum-e:#7a4a7e;--plum-t:#efe5ef;--amber-e:#7d5200;--amber-t:#f6ead0;--clay-e:#a63d2a;--clay-t:#f7e3dc;--slate-e:#656a60;--slate-t:#ecebe4}
@media(prefers-color-scheme:dark){:root{--paper:#191d1a;--card:#212722;--ink:#eeebe0;--muted:#abb2a5;--line:#444d44;--accent:#9bcab0;--wash:#2c3b31;--shadow:#0006;
--green-e:#9bcab0;--green-t:#2c3b31;--blue-e:#8fbde0;--blue-t:#23323f;--plum-e:#cfa6d3;--plum-t:#382c3a;--amber-e:#e0b867;--amber-t:#3b3220;--clay-e:#eb9d8a;--clay-t:#402924;--slate-e:#abb2a5;--slate-t:#2b302b}}
/* Roles: edge for borders, icons and tags; tint for fills. Body text stays --ink. */
[data-role=green]{--e:var(--green-e);--t:var(--green-t)}
[data-role=blue]{--e:var(--blue-e);--t:var(--blue-t)}
[data-role=plum]{--e:var(--plum-e);--t:var(--plum-t)}
[data-role=amber]{--e:var(--amber-e);--t:var(--amber-t)}
[data-role=clay]{--e:var(--clay-e);--t:var(--clay-t)}
[data-role=slate]{--e:var(--slate-e);--t:var(--slate-t)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);overflow-wrap:anywhere}
main{max-width:1080px;margin:auto;padding:48px 32px 32px}
main>*{animation:arrive var(--slow) backwards} /* backwards: no transform left behind, so fixed labels stay on the page */
.box,.arrow{animation:arrive .6s ease-out backwards;animation-delay:calc(100ms + var(--i,0)*60ms)}
header{border-top:3px solid var(--ink);padding-top:var(--gap);margin-bottom:32px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px var(--gap)}
.eyebrow,.caption,.tag,.arrow,.chip,.legend,footer{font:11px/1.5 var(--mono);letter-spacing:.05em;color:var(--muted);margin:0}
.eyebrow,.tag{text-transform:uppercase}
.eyebrow{color:var(--accent)}
.tag{display:block;margin-bottom:4px}
h1{width:fit-content;font:normal clamp(32px,6vw,56px)/1.08 var(--serif);letter-spacing:-.03em;margin:20px 0 10px;text-wrap:balance}
h1.long{font-size:clamp(26px,4vw,40px)}
h2.tag{margin-bottom:10px}
.caption+.callout{margin-top:16px}
.callout{margin:0 0 12px;max-width:64ch;padding:10px 14px;border-left:3px solid var(--e,var(--accent));background:var(--t,var(--wash))}
.callout .tag{color:var(--e)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 10px}
.glyph{color:var(--e)}
.chip{display:inline-block;padding:1px 8px;border:1px solid var(--e,var(--line));background:var(--t,var(--card));border-radius:99px;color:var(--ink)}
.chip[data-role=slate]{border-style:dashed}
button{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle{min-width:28px;height:28px;padding:0 6px;border:1px solid var(--line);background:none;border-radius:var(--radius);font:14px/26px var(--mono);color:var(--muted);text-align:center}
.tools{display:flex;align-items:center;gap:8px}
.toggle[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.box:not([data-role]){--e:var(--line);--t:var(--card)}
.box{display:block;width:100%;padding:14px var(--pad);background:var(--t);border:1px solid var(--e);border-radius:var(--radius);font:18px/1.25 var(--serif);transition:border-color var(--fast),background var(--fast),box-shadow var(--fast)}
.box .label{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.box[data-role] .tag{color:var(--e)}
.box[data-role=slate]{border-style:dashed}
.box:not([data-role]):hover,.box:not([data-role])[aria-expanded=true]{--e:var(--accent);--t:var(--wash)}
.box[data-role]:hover,.box[data-role][aria-expanded=true]{box-shadow:inset 0 0 0 1px var(--e)}
.arrow{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;width:100%;min-height:44px;padding:4px var(--pad);border:0;background:none;transition:color var(--fast)}
.arrow::before{content:'↓';font-size:16px;color:var(--e,var(--accent))}
.arrow:hover,.arrow[aria-expanded=true]{color:var(--e,var(--accent))}
.note{display:none;margin-top:6px;font:14px/1.45 var(--sans);color:var(--ink);white-space:pre-line;text-transform:none;letter-spacing:0;flex-basis:100%}
.all .note{display:block}
.all .detail:not(.pinned){display:none}
.all .box .label{-webkit-line-clamp:none}
.notes{display:none;margin-top:32px}
.notes li{margin-bottom:6px;white-space:pre-line}
.all .notes{display:block}
.more{flex:none;padding:1px 8px;border:1px solid var(--line);border-radius:99px;background:none;font:11px/1.5 var(--mono);letter-spacing:.05em;color:var(--muted)}
.more::before{content:'+ '}
.more[aria-expanded=true]::before{content:'− '}
.more:hover,.more[aria-expanded=true]{color:var(--accent);border-color:var(--accent)}
.step{display:grid;grid-template-rows:1fr;min-width:0}
.step>.more{justify-self:end;margin-top:4px}
.step>.box.part{width:auto;margin-left:28px}
.part{display:none;margin-top:8px}
.open>.part,.all .part{display:block}
.open>.risks,.all .risks{display:flex;flex-wrap:wrap;align-items:center;gap:8px;grid-column:1/-1}
.risks .chip{border-radius:12px}
.all .risks .chip{padding:6px 10px;border-radius:var(--radius)}
.box.part{padding:8px var(--pad);font-size:15px;animation:arrive var(--fast)}
.jobs{margin-top:48px}
.scroll{overflow-x:auto;padding-bottom:4px}
.lanes{position:relative;display:grid;grid-template-columns:136px repeat(var(--n),minmax(150px,1fr));min-width:calc(136px + var(--n)*150px)}
.lanes>:not(svg){min-width:0;padding:12px 14px;border-top:1px solid var(--line)}
.lanes>h3{padding-left:0}
.lanes>span,.phase{border:0}
.phase{background:none;font:18px/1.25 var(--serif)}
.phase:hover,.phase[aria-expanded=true]{color:var(--accent)}
.cell{display:grid;gap:10px;align-content:start}
.job{padding:8px 12px;font-size:15px}
.job.on{--e:var(--accent)}
.dim .job:not(.on){opacity:.4;transition:opacity var(--fast)}
.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;color:var(--muted)}
.links .hot,#hot{color:var(--accent)}
.links path{fill:none;stroke:currentColor;stroke-width:1;opacity:.55}
.links .hot{stroke-width:1.8;opacity:1}
.dim .links path:not(.hot){opacity:.15}
.links marker path{fill:currentColor;stroke:none;opacity:1}
footer{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:32px;padding-top:var(--gap);border-top:1px solid var(--line)}
footer a{color:inherit;text-underline-offset:3px}
.detail{position:fixed;z-index:9;width:min(300px,calc(100vw - 24px));max-height:min(60vh,420px);overflow:auto;padding:var(--gap) var(--pad);background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:0 8px 28px var(--shadow);pointer-events:none;animation:fade var(--fast)} /* fade, not slide: floating labels measure where it really is */
.detail[hidden]{display:none}
.detail h2{font:normal 20px/1.2 var(--serif);margin:0 28px 6px 0}
.detail p{margin:0;font-size:14px;white-space:pre-line}
.close{display:none;position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;font-size:20px;text-align:center}
.pinned{pointer-events:auto}
.pinned .close{display:block}
.card{max-width:640px;margin:48px auto;padding:24px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--e,var(--ink));font:15px/1.5 var(--sans)}
.card h1{font-size:28px;margin:0 0 8px}
.card pre{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--paper);padding:10px;margin:12px 0 0}
@keyframes arrive{from{opacity:0;translate:0 12px}}
@keyframes fade{from{opacity:0}}
@media(max-width:600px){main{padding:24px 16px}.detail{width:calc(100vw - 24px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
:root{color-scheme:light}
*{animation:none!important}
.toggle,.detail,.tools{display:none!important}
.note,.notes,.part{display:block}
.links{display:none}
.box .label{-webkit-line-clamp:none}
.box,.arrow,tr{break-inside:avoid}
main{padding:0}
footer a::after{content:' ' attr(href)}}

/* gantt-chart only */
main{max-width:1280px}
.legend{align-items:center;margin-bottom:14px}
.g-key{display:inline-flex;align-items:center;gap:7px;padding:2px 0;border:0;background:none}
.g-key:hover,.g-key[aria-expanded=true]{color:var(--e)}
.g-key .g-fill{position:relative;inset:auto;width:24px;height:10px;border-radius:3px;animation:none}
.g-done::before{content:'';display:inline-block;width:24px;height:10px;margin-right:7px;border:1px solid var(--muted);border-radius:3px;background:linear-gradient(90deg,var(--muted) 60%,transparent 0)}
.g-scroll{overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.g-board{--names:216px;position:relative;isolation:isolate;display:grid;grid-template-columns:var(--names) minmax(560px,1fr);padding-bottom:26px}
.g-row{display:contents}
.g-name{position:sticky;left:0;z-index:4;display:flex;align-items:center;gap:2px;min-height:46px;padding:8px 12px 8px 0;background:var(--paper);border-top:1px solid var(--line);font:16px/1.2 var(--serif);transition:color var(--fast)}
.g-label{flex:1;min-width:0}
.g-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.all .g-text{-webkit-line-clamp:none}
.g-who{display:block;margin-top:2px;font:10px/1.4 var(--mono);letter-spacing:.05em;color:var(--muted)}
.g-corner{align-items:end;border:0;font:10px/1.5 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.g-risk{flex:none;padding:6px 4px;border:0;background:none;font-size:10px;color:var(--e)}
.g-axis{position:relative;height:58px}
.g-era,.g-tick{position:absolute;padding-left:6px;font:10px/1.5 var(--mono);letter-spacing:.05em;white-space:nowrap;color:var(--muted)}
.g-era{top:10px;text-transform:uppercase;color:var(--ink)}
.g-tick{bottom:7px}
.g-lane{position:relative;border-top:1px solid var(--line);transition:background var(--fast)}
.g-row:hover .g-lane{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.g-back{position:absolute;left:var(--names);right:0;top:32px;bottom:0;pointer-events:none}
.g-back>*{position:absolute;top:0;bottom:0}
.g-grid{border-left:1px solid var(--line);opacity:.55}
.g-major{top:-22px;opacity:1}
.g-rest{top:26px;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px);opacity:.5}
.g-fold{top:26px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--paper) 0 3px,var(--line) 3px 4px);border-inline:1px dashed var(--muted)}
.g-fold span{writing-mode:vertical-rl;padding:8px 0;background:var(--paper);font:10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.g-today{top:26px;border-left:2px solid var(--clay-e);transform-origin:top;animation:g-drop .6s .3s cubic-bezier(.2,.7,.2,1) backwards}
.g-today span{position:absolute;bottom:5px;left:6px;font:10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--clay-e)}
.g-today.g-flip span{left:auto;right:8px}
.g-bar{position:absolute;top:50%;height:22px;margin-top:-11px;padding:0;border:0;background:none;z-index:3;transition:opacity var(--fast)}
.g-fill{position:absolute;inset:0;overflow:hidden;border:1px solid var(--e);border-radius:6px;background:var(--t);transition:box-shadow var(--fast);animation:g-grow .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(150ms + var(--i,0)*55ms)}
.g-fill::before{content:'';position:absolute;inset:0 auto 0 0;width:var(--done,0%);background:color-mix(in srgb,var(--e) 45%,var(--t))}
.g-fill::after{content:'';position:absolute;inset:0;opacity:.45}
[data-cue="1"] .g-fill::after{background:repeating-linear-gradient(135deg,var(--e) 0 1px,transparent 1px 6px)}
[data-cue="2"] .g-fill::after{background:radial-gradient(var(--e) 1px,transparent 1.4px) 1px 1px/6px 6px}
[data-cue="3"] .g-fill::after{background:repeating-linear-gradient(90deg,var(--e) 0 1px,transparent 1px 5px)}
[data-cue="4"] .g-fill::after{background:repeating-linear-gradient(45deg,var(--e) 0 1px,transparent 1px 6px)}
[data-cue="5"] .g-fill{border-style:dashed}
.g-bar:hover .g-fill,.g-bar[aria-expanded=true] .g-fill,.g-dim .g-on .g-fill{box-shadow:0 0 0 1px var(--e),0 4px 14px var(--shadow)}
.g-gate{position:absolute;right:-7px;top:4px;width:14px;height:14px;rotate:45deg;border-radius:2px;background:var(--e);box-shadow:0 0 0 2px var(--paper);animation:g-pop .35s backwards;animation-delay:calc(650ms + var(--i,0)*55ms)}
.g-point{width:14px;margin-left:-7px}
.g-point .g-fill{display:none}
.g-point .g-gate{right:0;animation-delay:calc(150ms + var(--i,0)*55ms)}
.g-cap{position:absolute;left:calc(100% + 14px);top:3px;font:10px/16px var(--mono);letter-spacing:.05em;white-space:nowrap;color:var(--muted);animation:fade .4s backwards;animation-delay:calc(650ms + var(--i,0)*55ms)}
.g-flip .g-cap{left:auto;right:calc(100% + 14px)}
.g-in .g-cap{left:auto;right:14px;padding:0 5px;border-radius:3px;background:var(--t);color:var(--ink)}
.g-loose{left:1.5%;width:112px}
.g-loose .g-fill{border-style:dashed;background:none}
.g-loose .g-cap{right:8px;background:none;color:var(--muted)}
.g-bar .note,.g-risk .note{display:none!important}
.g-wires{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;color:var(--muted)}
.g-wires g path{fill:none;stroke:currentColor;stroke-width:1;opacity:.5;transition:opacity var(--fast)}
.g-wires .g-hot,#g-hot{color:var(--accent)}
.g-wires g .g-hot{stroke-width:1.8;opacity:1}
.g-wires marker path{fill:currentColor}
.g-dim .g-row:not(.g-on) .g-bar{opacity:.22}
.g-dim .g-row:not(.g-on) .g-name{color:var(--muted)}
.g-dim .g-wires g path:not(.g-hot){opacity:.12}
.g-list{display:none;margin:32px 0 0;padding-left:18px;max-width:72ch}
.g-list li{margin-bottom:12px;white-space:pre-line;font-size:14px}
.g-list b{font:normal 18px/1.3 var(--serif)}
.all .g-list{display:block}
@keyframes g-grow{from{clip-path:inset(0 100% 0 0)}}
@keyframes g-pop{from{scale:0}}
@keyframes g-drop{from{scale:1 0}}
@media(max-width:600px){.g-board{--names:128px}.g-name:not(.g-corner){font-size:14px}.g-who{display:none}}
@media print{.g-text{-webkit-line-clamp:none}.g-scroll{overflow:visible}.g-board{grid-template-columns:150px minmax(0,1fr);--names:150px}.g-name{position:static}.g-wires,.g-risk{display:none}.g-list{display:block}.g-fill,.g-gate,.g-fill::before,.g-fill::after{print-color-adjust:exact;-webkit-print-color-adjust:exact}.g-row{break-inside:avoid}}
</style>

  const fw=shown*.06,total=shown+fw*folds.length; // every fold is drawn 6% of the busy time wide
  const pos=n=>{let x=n-lo;folds.forEach(f=>{if(n>f.a)x-=(Math.min(n,f.b)-f.a)*(1-fw/(f.b-f.a))});return 1.5+97*x/total};
  const at=(n,x,w)=>{n.style.left=x+'%';if(w!=null)n.style.width=w+'%';return n};

  const scroll=el('div','g-scroll'),board=el('section','g-board'),axis=el('div','g-axis'),back=el('div','g-back');
  board.append(el('div','g-name g-corner',busy.length?fmt(lo,year(lo)!==year(hi-1))+' – '+fmt(hi-1,1):''),axis,back);
  let lastTick=-99,lastEra=-99,era;
  for(let n=lo;n<hi&&busy.length;n++){
    if(folds.some(f=>n>=f.a&&n<f.b))continue;
    const d=utc(n),dom=d.getUTCDate(),wd=d.getUTCDay(),x=pos(n),start=n===lo||folds.some(f=>f.b===n);
    if(scale==='day'&&(wd===0||wd===6))back.append(at(el('i','g-rest'),x,pos(n+1)-x));
    const name=scale==='month'?''+d.getUTCFullYear():MON[d.getUTCMonth()]+' '+d.getUTCFullYear(),turn=name!==era;
    if(turn){era=name;if(x-lastEra>5){axis.append(at(el('span','g-era',name),x));lastEra=x}}
    if(!(start||turn||(scale==='day'||(scale==='week'?wd===1:dom===1))))continue;
    back.append(at(el('i','g-grid'+(turn&&!start?' g-major':'')),x));
    const wide=scale==='day'&&shown<=14,label=scale==='month'?MON[d.getUTCMonth()]:wide?WD[wd]+' '+dom:''+dom;
    if(x-lastTick>=(wide?6.5:scale==='month'?4:3.2)&&(scale!=='day'||shown<=21||wd===1||start)){axis.append(at(el('span','g-tick',label),x));lastTick=x}
  }
  folds.forEach(f=>{const band=at(el('i','g-fold'),pos(f.a),pos(f.b)-pos(f.a));band.append(el('span','',span(f.b-f.a,LONG)));back.append(band)});
  if(today!==null){const line=at(el('i','g-today'+(pos(today)>88?' g-flip':'')),pos(today+.5));line.append(el('span','','Today'));back.append(line)}

  const full=el('ul','g-list');
  tasks.forEach((t,i)=>{
    const r=ROLES[t.k%6],row=el('div','g-row'),name=el('div','g-name'),lane=el('div','g-lane'),label=el('span','g-label');
    const when=t.a===null?'No dates yet':t.point?fmt(t.b,1):fmt(t.a,year(t.a)!==year(t.b))+' – '+fmt(t.b,1)+' · '+span(t.b-t.a+1,LONG);
    const names=ts=>ts.map(o=>o.label).join(', ');
    t.detail=[t.detail,when+(t.gate&&!t.point?' · ends at a gate':t.point?' · gate':''),(named||kinds.length>1)&&'Kind: '+kinds[t.k].label,t.owner&&'Owner: '+t.owner,t.pct>0&&t.pct<100&&t.pct+'% done',t.pct===100&&'Done',
      t.parents.length&&'Needs: '+names(t.parents),t.children.length&&'Unlocks: '+names(t.children)].filter(Boolean).join('\n');
    label.append(el('span','g-text',t.label));
    if(t.owner)label.append(el('span','g-who',t.owner));
    name.append(label);
    t.risks.forEach(x=>{const b=tip(role(el('button','g-risk','▲'),'clay'),x);b.setAttribute('aria-label','Risk: '+x.label);name.append(b)});
    const bar=role(el('button','g-bar'+(t.point?' g-point':'')+(t.a===null?' g-loose g-in':'')),r),x=t.a===null?0:pos(t.point?t.b+.5:t.a),w=t.a===null||t.point?0:Math.max(.4,pos(t.b+1)-x);
    bar.dataset.cue=t.k%6;bar.dataset.task=i;bar.style.setProperty('--i',Math.min(i,14));bar.style.setProperty('--done',t.pct+'%');
    if(t.a!==null){at(bar,x,t.point?null:w);if(x+w>80)bar.classList.add(w>14?'g-in':'g-flip')}
    bar.append(el('span','g-fill'));
    if(t.gate)bar.append(el('span','g-gate'));
    bar.append(el('span','g-cap',t.a===null?'No dates yet':t.gate?fmt(t.b):span(t.b-t.a+1,SHORT)));
    tip(bar,t).setAttribute('aria-label',t.label+', '+when);
    t.bar=bar;t.row=row;lane.append(bar);row.append(name,lane);board.append(row);
    const li=el('li');li.append(el('b','',t.label),'\n'+[t.detail,...t.risks.map(x=>'▲ '+x.label+(x.detail?': '+x.detail:''))].join('\n'));full.append(li);
  });

  // Thin lines from each task to what it unlocks. Open a bar: its lines light up and the rest of the chart steps back. Open a kind: only its bars stay.
  const NS='http://www.w3.org/2000/svg',wires=document.createElementNS(NS,'svg'),head=id=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z"/></marker>`;
  wires.setAttribute('class','g-wires');wires.setAttribute('aria-hidden','true');wires.innerHTML=head('g-head')+head('g-hot')+'<g/>';
  board.append(wires);
  let current,kind;
  function draw(){
    const o=board.getBoundingClientRect(),on=tasks[current],near=new Set(on?[on,...on.parents,...on.children]:kind?tasks.filter(t=>t.k==kind-1):[]);
    wires.lastChild.replaceChildren();
    board.classList.toggle('g-dim',near.size>0);
    tasks.forEach(t=>{
      t.row.classList.toggle('g-on',near.has(t));
      t.parents.forEach(p=>{
        if(t.a===null||p.a===null)return;
        const a=p.bar.getBoundingClientRect(),b=t.bar.getBoundingClientRect(),hot=on&&(t===on||p===on);
        const ax=a.right-o.left+(p.gate&&!p.point?8:1),bx=b.left-o.left-2,ay=a.top+a.height/2-o.top,by=b.top+b.height/2-o.top,dx=Math.max(22,Math.abs(bx-ax)/2);
        const path=document.createElementNS(NS,'path');
        path.setAttribute('d',`M${ax} ${ay}C${ax+dx} ${ay} ${bx-dx} ${by} ${bx} ${by}`);
        path.setAttribute('marker-end',hot?'url(#g-hot)':'url(#g-head)');if(hot)path.setAttribute('class','g-hot');
        wires.lastChild[hot?'append':'prepend'](path);
      });
    });
  }
  onShow=b=>{current=b.dataset.task;kind=b.dataset.kind;draw()};
  onHide=()=>{current=kind=null;draw()};
  scroll.addEventListener('scroll',soon,{passive:true});
  new ResizeObserver(draw).observe(board);

  // Kinds: colour, plus a fill pattern so the chart still reads in greyscale.
  if(named||kinds.length>1||tasks.some(t=>t.gate)){
    const key=el('p','legend');
    if(named||kinds.length>1)kinds.forEach((k,i)=>{const b=role(el('button','g-key'),ROLES[i%6]);b.dataset.cue=i%6;b.dataset.kind=i+1;b.append(el('span','g-fill'),k.label);key.append(tip(b,{...k,detail:k.detail||tasks.filter(t=>t.k===i).map(t=>t.label).join('\n')}))});
    if(tasks.some(t=>t.gate))key.append(el('span','','◆ Gate'));
    if(tasks.some(t=>t.pct>0))key.append(el('span','g-done','Done so far'));
    main.append(key);
  }
  scroll.append(board);main.append(scroll,full);
});

})();
</script>
