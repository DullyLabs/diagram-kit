<style>
:root{color-scheme:light dark;--paper:#f5f2ea;--card:#fdfbf5;--ink:#272b26;--muted:#656a60;--line:#cecfc3;--accent:#2f6452;--wash:#e6ede4;--shadow:#272b2622;--serif:Georgia,serif;--sans:system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--gap:16px;--pad:20px;--radius:2px;--fast:.18s;--slow:.5s;
--green-e:#2f6452;--green-t:#e6ede4;--blue-e:#2b5f8a;--blue-t:#e3ecf3;--plum-e:#7a4a7e;--plum-t:#efe5ef;--amber-e:#7d5200;--amber-t:#f6ead0;--clay-e:#a63d2a;--clay-t:#f7e3dc;--slate-e:#656a60;--slate-t:#ecebe4}
@media(prefers-color-scheme:dark){:root{--paper:#191d1a;--card:#212722;--ink:#eeebe0;--muted:#abb2a5;--line:#444d44;--accent:#9bcab0;--wash:#2c3b31;--shadow:#0006;
--green-e:#9bcab0;--green-t:#2c3b31;--blue-e:#8fbde0;--blue-t:#23323f;--plum-e:#cfa6d3;--plum-t:#382c3a;--amber-e:#e0b867;--amber-t:#3b3220;--clay-e:#eb9d8a;--clay-t:#402924;--slate-e:#abb2a5;--slate-t:#2b302b}}
/* Roles: edge for borders, icons and tags; tint for fills. Body text stays --ink. */
[data-role=green]{--e:var(--green-e);--t:var(--green-t)}
[data-role=blue]{--e:var(--blue-e);--t:var(--blue-t)}
[data-role=plum]{--e:var(--plum-e);--t:var(--plum-t)}
[data-role=amber]{--e:var(--amber-e);--t:var(--amber-t)}
[data-role=clay]{--e:var(--clay-e);--t:var(--clay-t)}
[data-role=slate]{--e:var(--slate-e);--t:var(--slate-t)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);overflow-wrap:anywhere}
main{max-width:1080px;margin:auto;padding:48px 32px 32px}
main>*{animation:arrive var(--slow) backwards} /* backwards: no transform left behind, so fixed labels stay on the page */
.box,.arrow{animation:arrive .6s ease-out backwards;animation-delay:calc(100ms + var(--i,0)*60ms)}
header{border-top:3px solid var(--ink);padding-top:var(--gap);margin-bottom:32px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px var(--gap)}
.eyebrow,.caption,.tag,.arrow,.chip,.legend,footer{font:11px/1.5 var(--mono);letter-spacing:.05em;color:var(--muted);margin:0}
.eyebrow,.tag{text-transform:uppercase}
.eyebrow{color:var(--accent)}
.tag{display:block;margin-bottom:4px}
h1{width:fit-content;font:normal clamp(32px,6vw,56px)/1.08 var(--serif);letter-spacing:-.03em;margin:20px 0 10px;text-wrap:balance}
h1.long{font-size:clamp(26px,4vw,40px)}
h2.tag{margin-bottom:10px}
.callout{margin:0 0 12px;max-width:64ch;padding:10px 14px;border-left:3px solid var(--e,var(--accent));background:var(--t,var(--wash))}
.callout .tag{color:var(--e)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 10px}
.glyph{color:var(--e)}
.chip{display:inline-block;padding:1px 8px;border:1px solid var(--e,var(--line));background:var(--t,var(--card));border-radius:99px;color:var(--ink)}
.chip[data-role=slate]{border-style:dashed}
button{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle{min-width:28px;height:28px;padding:0 6px;border:1px solid var(--line);background:none;border-radius:var(--radius);font:14px/26px var(--mono);color:var(--muted);text-align:center}
.tools{display:flex;align-items:center;gap:8px}
.toggle[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.box:not([data-role]){--e:var(--line);--t:var(--card)}
.box{display:block;width:100%;padding:14px var(--pad);background:var(--t);border:1px solid var(--e);border-radius:var(--radius);font:18px/1.25 var(--serif);transition:border-color var(--fast),background var(--fast),box-shadow var(--fast)}
.box .label{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.box[data-role] .tag{color:var(--e)}
.box[data-role=slate]{border-style:dashed}
.box:not([data-role]):hover,.box:not([data-role])[aria-expanded=true]{--e:var(--accent);--t:var(--wash)}
.box[data-role]:hover,.box[data-role][aria-expanded=true]{box-shadow:inset 0 0 0 1px var(--e)}
.arrow{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;width:100%;min-height:44px;padding:4px var(--pad);border:0;background:none;transition:color var(--fast)}
.arrow::before{content:'↓';font-size:16px;color:var(--e,var(--accent))}
.arrow:hover,.arrow[aria-expanded=true]{color:var(--e,var(--accent))}
.note{display:none;margin-top:6px;font:14px/1.45 var(--sans);color:var(--ink);white-space:pre-line;text-transform:none;letter-spacing:0;flex-basis:100%}
.all .note{display:block}
.all .detail:not(.pinned){display:none}
.all .box .label{-webkit-line-clamp:none}
.notes{display:none;margin-top:32px}
.notes li{margin-bottom:6px;white-space:pre-line}
.all .notes{display:block}
.more{flex:none;padding:1px 8px;border:1px solid var(--line);border-radius:99px;background:none;font:11px/1.5 var(--mono);letter-spacing:.05em;color:var(--muted)}
.more::before{content:'+ '}
.more[aria-expanded=true]::before{content:'− '}
.more:hover,.more[aria-expanded=true]{color:var(--accent);border-color:var(--accent)}
.step{display:grid;grid-template-rows:1fr;min-width:0}
.step>.more{justify-self:end;margin-top:4px}
.step>.box.part{width:auto;margin-left:28px}
.part{display:none;margin-top:8px}
.open>.part,.all .part{display:block}
.open>.risks,.all .risks{display:flex;flex-wrap:wrap;align-items:center;gap:8px;grid-column:1/-1}
.risks .chip{border-radius:12px}
.all .risks .chip{padding:6px 10px;border-radius:var(--radius)}
.box.part{padding:8px var(--pad);font-size:15px;animation:arrive var(--fast)}
.jobs{margin-top:48px}
.scroll{overflow-x:auto;padding-bottom:4px}
.lanes{position:relative;display:grid;grid-template-columns:136px repeat(var(--n),minmax(150px,1fr));min-width:calc(136px + var(--n)*150px)}
.lanes>:not(svg){min-width:0;padding:12px 14px;border-top:1px solid var(--line)}
.lanes>h3{padding-left:0}
.lanes>span,.phase{border:0}
.phase{background:none;font:18px/1.25 var(--serif)}
.phase:hover,.phase[aria-expanded=true]{color:var(--accent)}
.cell{display:grid;gap:10px;align-content:start}
.job{padding:8px 12px;font-size:15px}
.job.on{--e:var(--accent)}
.dim .job:not(.on){opacity:.4;transition:opacity var(--fast)}
.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;color:var(--muted)}
.links .hot,#hot{color:var(--accent)}
.links path{fill:none;stroke:currentColor;stroke-width:1;opacity:.55}
.links .hot{stroke-width:1.8;opacity:1}
.dim .links path:not(.hot){opacity:.15}
.links marker path{fill:currentColor;stroke:none;opacity:1}
footer{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:32px;padding-top:var(--gap);border-top:1px solid var(--line)}
footer a{color:inherit;text-underline-offset:3px}
.detail{position:fixed;z-index:9;width:min(300px,calc(100vw - 24px));max-height:min(60vh,420px);overflow:auto;padding:var(--gap) var(--pad);background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:0 8px 28px var(--shadow);pointer-events:none;animation:arrive var(--fast)}
.detail[hidden]{display:none}
.detail h2{font:normal 20px/1.2 var(--serif);margin:0 28px 6px 0}
.detail p{margin:0;font-size:14px;white-space:pre-line}
.close{display:none;position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;font-size:20px;text-align:center}
.pinned{pointer-events:auto}
.pinned .close{display:block}
.card{max-width:640px;margin:48px auto;padding:24px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--e,var(--ink));font:15px/1.5 var(--sans)}
.card h1{font-size:28px;margin:0 0 8px}
.card pre{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--paper);padding:10px;margin:12px 0 0}
@keyframes arrive{from{opacity:0;translate:0 12px}}
@media(max-width:600px){main{padding:24px 16px}.detail{width:calc(100vw - 24px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
:root{color-scheme:light}
*{animation:none!important}
.toggle,.detail,.tools{display:none!important}
.note,.notes,.part{display:block}
.links{display:none}
.box .label{-webkit-line-clamp:none}
.box,.arrow,tr{break-inside:avoid}
main{padding:0}
footer a::after{content:' ' attr(href)}}

/* before-after only */
.side{display:none}
.theme{display:grid;max-width:480px;margin-bottom:32px}
.theme h2{display:flex;align-items:center;gap:8px}
.theme h2 .chip{margin-left:auto}
.theme h2 .chip,.after{border-left-width:3px}
.name{padding:0 var(--pad)}
.name::before{content:'↓ '}
.same{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:32px}
.same h2{margin:0 8px 0 0}
@media(min-width:720px){
.sides{--mid:200px;position:relative;display:grid;grid-template-columns:1fr var(--mid) 1fr;padding-bottom:var(--gap)}
.sides::before{content:'';position:absolute;inset:0 0 0 auto;width:calc((100% - var(--mid))/2);background:var(--t);border-top:3px solid var(--e)}
.side,.theme>*{position:relative}
.side{display:block;margin:0;padding:14px 0 6px;font:22px/1.2 var(--serif);color:var(--e)}
.side+.side{grid-column:3;padding-left:var(--gap)}
.theme{display:contents}
.theme h2{grid-column:1/-1;margin:18px 0 10px;padding:10px var(--gap) 0 0;border-top:1px solid var(--line)}
.before{grid-column:1}
.sides .arrow{grid-column:2;flex-direction:column;justify-content:center;gap:0;padding:4px 12px;text-align:center}
.sides .arrow::before{content:'⟶';font-size:22px;line-height:1}
.sides .arrow .note{flex-basis:auto}
.after{grid-column:3;width:auto;margin:0 var(--gap);background:var(--card)}
.after.part{margin-top:8px}
.name{grid-column:2;align-self:center;padding:0 12px;text-align:center}
.name::before{content:'→ '}
.sides .box .tag{display:none}}
</style>

const txt=v=>v==null||v===false?'':Array.isArray(v)?v.map(txt).filter(Boolean).join('\n'):typeof v==='object'?txt(v.label??v.text??v.name??v.title):String(v).replace(/<\/?(?:a|b|i|u|em|strong|code|pre|p|br|div|span|ul|ol|li|h[1-6]|img|script|style|table|tr|td|th|font|small|sup|sub)\b[^>]*>/gi,'').replace(/(^|[^\w])(\*\*|__)(\S(?:.*?\S)?)\2(?!\w)/g,'$1$3').replace(/`/g,'').trim();
const list=v=>Array.isArray(v)?v.filter(x=>x!=null&&x!==''):v==null||v===''||v===false?[]:typeof v==='object'?Object.values(v):String(v).split(/\s*[;\n]\s*|,\s+/).filter(Boolean);
const item=v=>{
  if(v==null||typeof v!=='object'||Array.isArray(v))return{label:txt(v),detail:''};
  const detail=txt(v.detail??v.details??v.description??v.desc??v.note);
  return{...v,label:txt(v.label??v.name??v.title??v.text??v.id)||detail.slice(0,40),detail};
};
const pick=(v,map,dflt)=>{const k=txt(v).toLowerCase();return Object.hasOwn(map,k)?map[k]:dflt};
const slug=s=>txt(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-'); // ids: case, spaces and punctuation don't matter
const yes=v=>v===true||/^(true|yes|y|1)$/i.test(txt(v));

let onShow=()=>{},onHide=()=>{},keepOpen=()=>false,popOpts;
const main=el('main'),header=el('header'),footer=el('footer');
// One popover for boxes and arrows: hover or focus shows, click or Enter pins, Esc or × closes.
const pop=el('aside','detail'),popTitle=el('h2'),popBody=el('p'),closer=el('button','close','×');
pop.id='detail';pop.hidden=true;closer.type='button';closer.setAttribute('aria-label','Close');pop.append(popTitle,popBody,closer);
let active=null,pinned=false,timer,quiet=false;
// Put a position:fixed element in the emptiest spot near target: least overlap with obstacles, then nearest. Reusable for any floating label.
function nestle(el,target,opts={}){ // target: an element, or any object with getBoundingClientRect()
  const {gap=8,margin=12,pull=10,stick=2000,obstacles='.box,.arrow,.wire-label,table,h1,h2,.tools,.callout,.caption,.legend,[data-obstacle]'}=opts;
  const t=target.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,last=el._nestle||{};
  const fit=(v,size,max)=>Math.max(margin,Math.min(v,max-size-margin));
  const cover=(x,y,r)=>Math.max(0,Math.min(x+w,r.right)-Math.max(x,r.left))*Math.max(0,Math.min(y+h,r.bottom)-Math.max(y,r.top));
  const rects=[...document.querySelectorAll(obstacles)].filter(o=>!(target instanceof Node&&(o.contains(target)||target.contains(o)))&&!el.contains(o)&&o!==el).map(o=>o.getBoundingClientRect());
  // Candidates per axis: beside the target, aligned with it, centred on it, or against a viewport edge. Order breaks ties: below, right, left, above.
  // Also try just past each nearby obstacle, which finds gaps like the space under a short column.
  const near=rects.filter(r=>Math.abs(r.top-t.top)<2*h+t.height&&Math.abs(r.left-t.left)<2*w+t.width);
  const xs=[t.left,t.right+gap,t.left-w-gap,t.right-w,t.left+(t.width-w)/2,0,innerWidth,...near.flatMap(r=>[r.left,r.right+gap])].map(v=>fit(v,w,innerWidth));
  const ys=[t.bottom+gap,t.top,t.top-h-gap,t.bottom-h,t.top+(t.height-h)/2,0,innerHeight,...near.flatMap(r=>[r.top,r.bottom+gap])].map(v=>fit(v,h,innerHeight));
  let best,low=Infinity;
  ys.forEach((y,j)=>xs.forEach((x,i)=>{
    const k=x+','+y,away=Math.hypot(Math.max(t.left-x-w,x-t.right,0),Math.max(t.top-y-h,y-t.bottom,0));
    const score=rects.reduce((s,r)=>s+cover(x,y,r),4*cover(x,y,t))+pull*away-(last.target===target&&last.k===k?stick:0); // stick: no side-hopping on scroll
    if(score<low){low=score;best={x,y,k}}
  }));
  el._nestle={target,k:best.k};
  el.style.left=best.x+'px';el.style.top=best.y+'px';
}
function place(){
  if(!active)return;
  if(innerWidth>=600)return nestle(pop,active,popOpts);
  const r=active.getBoundingClientRect(),h=pop.offsetHeight; // phone: dock away from the target
  pop.style.left='12px';pop.style.top=(r.bottom>innerHeight-h-24?12:innerHeight-h-12)+'px';
}
function release(btn){btn.setAttribute('aria-expanded','false');btn.removeAttribute('aria-describedby')}
function hide(refocus){
  clearTimeout(timer);
  const old=active;
  if(!old)return;
  release(old);active=null;pinned=false;pop.hidden=true;onHide();
  if(refocus){quiet=true;old.focus();quiet=false}
}
function show(btn,it,pin){
  if(quiet||(pinned&&!pin))return;
  clearTimeout(timer);
  if(active)release(active);
  active=btn;pinned=pin;
  btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-describedby','detail');
  popTitle.textContent=it.label;popBody.textContent=it.detail;popBody.hidden=!it.detail;
  pop.classList.toggle('pinned',pin);pop.hidden=false;onShow(btn);place(); // after onShow, so the popover also avoids anything onShow drew
  if(pin&&btn.dataset.n)history.replaceState(null,'','#item-'+btn.dataset.n); // a pinned item becomes a link
}
function later(){clearTimeout(timer);timer=setTimeout(()=>{if(!pinned&&!keepOpen())hide()},200)}
const tips=[];
function tip(btn,it){
  if(!btn.classList.contains('wire-label')){tips.push({btn,it});btn.dataset.n=tips.length} // no id, so the browser's own #jump never hides the title
  btn.type='button';btn.setAttribute('aria-expanded','false');btn.dataset.tip='';
  if(it.detail)btn.append(el('span','note',it.detail));
  btn.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show(btn,it,false)});
  btn.addEventListener('pointerleave',later);
  btn.addEventListener('focus',()=>show(btn,it,false));
  btn.addEventListener('blur',later);
  btn.addEventListener('click',()=>active===btn&&pinned?hide():show(btn,it,true));
  return btn;
}
const role=(n,r)=>{if(r)n.dataset.role=r;return n};
function box(it,tag,r,cls){
  const b=role(el('button','box'+(cls?' '+cls:'')),r);
  if(tag)b.append(el('span','tag',tag));
  b.append(el('span','label',it.label));
  return tip(b,it);
}
const arrow=(it,r)=>tip(role(el('button','arrow',it.label),r),it);
const legend=rows=>{const l=el('p','legend');rows.forEach(([r,glyph,text])=>{const s=role(el('span'),r);s.append(el('span','glyph',glyph),' '+text);l.append(s)});return l};
const callout=(tag,text,r)=>{const c=role(el('p','callout'),r||'green');c.append(el('span','tag',tag),text);return c};
// Depth, the same in every template: an item opens into its parts and risks, and its jobs join the plan below the diagram.
const lanes=[],count=(a,word)=>a.length?a.length+' '+word+(a.length>1?'s':''):'';
function depth(host,head,it,name,part,word='part'){ // part(p) draws one part into host; leave it out where parts don't fit
  const parts=part?list(it.parts).map(item):[],risks=list(it.risks).map(item),work=list(it.work??it.jobs).map(item);
  if(work.length)lanes.push({name,work});
  if(!parts.length&&!risks.length)return;
  const more=el('button','more',[count(parts,word),count(risks,'risk')].filter(Boolean).join(' · ')),chip=head.querySelector('.chip');
  more.type='button';more.setAttribute('aria-expanded','false');
  more.addEventListener('click',()=>more.setAttribute('aria-expanded',host.classList.toggle('open')));
  chip?chip.before(more):head.append(more);
  host.classList.add('deep');
  parts.forEach(p=>part(p));
  if(risks.length){
    const r=el('div','risks part');r.append(el('span','tag','Risks'));
    risks.forEach(x=>r.append(tip(role(el('button','chip','▲ '+x.label),'clay'),x)));host.append(r);
  }
}
// A box that can open: the box, then its parts and risks.
function step(b,it,name,word){
  const s=el('div','step');s.append(b);
  depth(s,s,it,name,p=>s.append(box(p,'',b.dataset.role,'part')),word);
  return s;
}
// The plan: one row per item that has jobs, one column per phase. A job names what it needs; lines join them.
function jobs(data){
  if(!lanes.length)return;
  const phases=list(data.phases).map(item),all=lanes.flatMap(l=>l.work),byId={};
  all.forEach(w=>{
    const k=slug(w.phase??w.when);
    w.id=slug(w.id||w.label);byId[w.id]=w;
    w.col=phases.findIndex(p=>slug(p.label)===k);
    if(w.col<0)w.col=+k>0&&+k<=phases.length?k-1:k||!phases.length?phases.push(item(k?w.phase??w.when:'Plan'))-1:0;
  });
  all.forEach(w=>{w.needs=list(w.needs??w.after).map(slug).filter(id=>byId[id]&&id!==w.id)});
  all.forEach(w=>{
    const names=ws=>ws.map(o=>o.label).join(', ');
    w.unlocks=all.filter(o=>o.needs.includes(w.id));
    w.detail=[w.detail,w.needs.length&&'Needs: '+names(w.needs.map(id=>byId[id])),w.unlocks.length&&'Unlocks: '+names(w.unlocks)].filter(Boolean).join('\n');
  });
  const plan=el('section','jobs'),scroll=el('div','scroll'),grid=el('div','lanes'),NS='http://www.w3.org/2000/svg',wires=document.createElementNS(NS,'svg');
  grid.style.setProperty('--n',phases.length);grid.append(el('span'));
  phases.forEach(p=>{const b=el('button','phase');b.append(el('span','label',p.label),el('span','tag',txt(p.when)));grid.append(tip(b,p))});
  lanes.forEach(l=>{
    const cells=phases.map(()=>el('div','cell'));
    l.work.forEach(w=>{w.b=box(w,txt(w.owner??w.who??w.team),'','job');w.b.dataset.job=w.id;w.b.lit=list(w.boxes).map(slug);cells[w.col].append(w.b)});
    grid.append(el('h3','tag',l.name),...cells);
  });
  wires.setAttribute('class','links');wires.setAttribute('aria-hidden','true');
  wires.innerHTML='<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z"/></marker><marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z"/></marker><g/>';
  grid.append(wires);
  let current;
  function draw(){
    const o=grid.getBoundingClientRect(),on=byId[current];
    wires.lastChild.replaceChildren();
    grid.classList.toggle('dim',!!on); // a job is open: fade everything it doesn't touch
    all.forEach(w=>w.b.classList.toggle('on',!!on&&(w===on||on.needs.includes(w.id)||on.unlocks.includes(w))));
    all.forEach(w=>w.needs.forEach(id=>{
      const a=byId[id].b.getBoundingClientRect(),b=w.b.getBoundingClientRect(),hot=on&&(w===on||id===on.id);
      const ay=a.top+a.height/2-o.top,by=b.top+b.height/2-o.top,across=a.right<b.left||b.right<a.left;
      // Different phases: curve across the gap. Same phase: curve down the left side.
      const ax=(across&&a.right<b.left?a.right:a.left)-o.left,bx=(across&&b.right<a.left?b.right:b.left)-o.left,bend=across?(ax+bx)/2:Math.min(ax,bx)-12;
      const path=document.createElementNS(NS,'path');
      path.setAttribute('d','M'+ax+' '+ay+'C'+bend+' '+ay+' '+bend+' '+by+' '+bx+' '+by);
      path.setAttribute('marker-end',hot?'url(#hot)':'url(#head)');if(hot)path.setAttribute('class','hot');
      wires.lastChild[hot?'append':'prepend'](path);
    }));
  }
  const show0=onShow,hide0=onHide; // keep the template's own hover behaviour
  onShow=btn=>{show0(btn);current=btn.dataset.job;draw()};
  onHide=()=>{hide0();current=null;draw()};
  new ResizeObserver(draw).observe(grid);
  scroll.append(grid);plan.append(el('h2','tag','The plan'),scroll);main.append(plan);
}
closer.addEventListener('click',()=>hide(true));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')return hide(true);
  // Arrow keys step through the boxes and arrows in reading order.
  const step={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key],here=document.activeElement;
  if(!step||!here?.matches('[data-tip]:not(.wire-label)'))return;
  const all=[...main.querySelectorAll('[data-tip]:not(.wire-label)')].filter(n=>n.offsetParent),next=all[all.indexOf(here)+step];
  if(next){e.preventDefault();next.focus();if(pinned)next.click()}
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest?.('.detail,[aria-expanded]'))hide()});
addEventListener('resize',place);addEventListener('scroll',place,{passive:true});

function fallback(text,done){const t=el('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();done()}
function card(title,lines,snippet,r){
  const c=role(el('section','card'),r||'clay');
  c.append(el('h1','',title));lines.forEach(l=>c.append(el('p','',l)));
  if(snippet)c.append(el('pre','',snippet));
  document.title=title;document.body.replaceChildren(c);
}
function parse(src){
  const a=src.indexOf('{'),b=src.lastIndexOf('}');
  const s=a<0||b<a?src.trim():src.slice(a,b+1).replace(/,(\s*[}\]])/g,'$1');
  try{return JSON.parse(s)}catch(e){
    const m=/position (\d+)/.exec(e.message),at=m?+m[1]:-1;
    e.snippet=at<0?s.slice(0,240):s.slice(Math.max(0,at-80),at)+' ⟵ HERE ⟶ '+s.slice(at,at+60);
    throw e;
  }
}
// key: the list that must have items; render(data) adds the template's sections to main.
function boot(key,render){
  let data;
  try{data=parse(document.getElementById('diagram-data').textContent)}
  catch(e){return card('This diagram could not load',['The JSON block in this file is broken. Fix the JSON block; change nothing else.','Problem: '+e.message],e.snippet)}
  if(Array.isArray(data))data={[key]:data};
  if(!data||typeof data!=='object')data={};
  for(const k in Object(data.style))if(k.startsWith('--'))document.documentElement.style.setProperty(k,txt(data.style[k])); // look tweaks: any variable from the top of the stylesheet
  const title=txt(data.title)||'Untitled';
  if(title==='REPLACE_ME')return card('No diagram yet',['Replace {"title":"REPLACE_ME"} in this file with your JSON, in the format SKILL.md shows. Change nothing else.'],'',  'amber');
  if(!list(data[key]).length)return card(title,['This diagram is empty. Add items to "'+key+'" in the JSON block, as SKILL.md shows.'],'','amber');
  try{
    document.title=title;
    const bar=el('div','bar'),h1=el('h1',title.length>40?'long':'',title),all=el('button','toggle','≡');all.title=all.ariaLabel='Show all details';
    all.type='button';all.setAttribute('aria-pressed','false');
    all.addEventListener('click',()=>all.setAttribute('aria-pressed',document.body.classList.toggle('all')));
    const copy=el('button','toggle','⧉');copy.type='button';copy.title=copy.ariaLabel='Copy as Markdown';
    copy.addEventListener('click',()=>{
      const one=s=>s.replace(/\s*\n+\s*/g,' ').trim(),tag=b=>b.querySelector('.tag')?.textContent;
      const md=['# '+title,...[...header.querySelectorAll('.callout')].map(c=>'> '+one(c.lastChild.textContent)),
        tips.map(({btn,it},i)=>(i+1)+'. **'+(tag(btn)?tag(btn)+': ':'')+it.label+'**'+(it.detail?' — '+one(it.detail):'')).join('\n'),
        ...[...main.querySelectorAll('.checks li,.same .chip,.notes li')].map(n=>'- '+one(n.textContent))].join('\n\n')+'\n'; // tags, summary, checks and connections keep their context
      const done=()=>{copy.textContent='✓';setTimeout(()=>copy.textContent='⧉',1500)};
      navigator.clipboard?.writeText(md).then(done,()=>fallback(md,done))??fallback(md,done);
    });
    const tools=el('div','tools');tools.append(all,copy);
    bar.append(el('p','eyebrow',txt(data.eyebrow)),tools);
    header.append(bar,h1);
    if(txt(data.caption))header.append(el('p','caption',txt(data.caption)));
    if(txt(data.footnote))footer.append(el('span','',txt(data.footnote)));
    list(data.sources).map(item).forEach(s=>{const url=txt(s.url??s.href??s.link);if(/^https:\/\//.test(url)){const a=el('a','',s.label||url);a.href=url;footer.append(a)}});
    main.append(header);render(data);jobs(data);main.append(footer);
    document.body.append(main,pop);
    main.querySelectorAll('.box,.arrow').forEach((n,i)=>n.style.setProperty('--i',Math.min(i,12))); // staggered entrance, ~0.8 s at most
    const linked=tips[(/^#item-(\d+)$/.exec(location.hash)?.[1]||0)-1]?.btn; // deep link: open that item
    linked?.closest('.deep:not(.open)')?.querySelector('.more')?.click(); // a linked part opens its item
    if(linked)setTimeout(()=>{const r=linked.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)linked.scrollIntoView({block:'center'});linked.click()},700);
  }catch(e){card('This diagram could not be drawn',['Something in the JSON block has an unexpected shape. Fix the JSON block; change nothing else.','Problem: '+e.message])}
}

const EFFECT={better:['green','▲','Better'],worse:['clay','▼','Worse'],same:['slate','=','Same'],removed:['clay','✕','Removed']};
const EFFECTS={better:'better',improved:'better',faster:'better',worse:'worse',slower:'worse',same:'same',unchanged:'same',removed:'removed',deleted:'removed',dropped:'removed',gone:'removed'};
const BEFORE='slate',AFTER='blue';
popOpts={pull:300}; // rows fill the page, so the detail stays beside its box and covers the next row instead
boot('themes',data=>{
  const themes=list(data.themes).map(item),same=list(data.unchanged).map(txt).filter(Boolean),sides=role(el('section','sides'),AFTER);
  if(txt(data.summary))header.append(callout('In short',txt(data.summary)));
  header.append(el('p','caption',themes.length+' changed'+(same.length?' · '+same.length+' stayed the same':'')));
  // Wide screens: every Before on the left, every After on the right. Narrow: each theme stacks, and the boxes carry the tags.
  [['Before',BEFORE],['After',AFTER]].forEach(([name,r])=>{const p=role(el('p','side',name),r);p.dataset.obstacle='';sides.append(p)});
  const pair=(theme,t,mid,cls)=>{
    const before=t.before??t.old??t.from,after=t.after??t.new??t.to;
    if(before!=null)theme.append(box(item(before),'Before',BEFORE,'before'+cls));
    if(mid)theme.append(mid);
    if(after!=null)theme.append(box(item(after),'After',AFTER,'after'+cls));
  };
  themes.forEach((t,i)=>{
    const name=String(i+1).padStart(2,'0')+' · '+t.label,theme=el('section','theme'),h=el('h2','tag',name),e=EFFECT[pick(t.effect,EFFECTS,'')];
    const change=t.change??t.how;
    if(e)h.append(role(el('span','chip',e[1]+' '+e[2]),e[0]));
    theme.append(h);
    pair(theme,t,change!=null&&arrow(item(change),AFTER),'');
    depth(theme,h,t,name,p=>pair(theme,p,el('p','tag part name',p.label),' part'));
    sides.append(theme);
  });
  main.append(sides);
  if(same.length){
    const s=el('section','same');s.append(el('h2','tag','Stayed the same'));
    same.forEach(x=>s.append(role(el('span','chip','= '+x),'slate')));main.append(s);
  }
});

})();
</script>
