<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232b6455'/%3E%3Cpath d='M9 8h14v6H9zm0 10h14v6H9z' fill='%23f6f3eb'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--paper:#f6f3eb;--card:#fcfaf5;--ink:#282c28;--muted:#666a60;--line:#cccfc2;--accent:#286451;--tint:#e8eee5;--shadow:#242b241c}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#191d1a;--card:#202622;--ink:#eeeee3;--muted:#b0b8aa;--line:#465147;--accent:#9bceb4;--tint:#293b30;--shadow:#0005}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}main{max-width:1160px;margin:auto;padding:52px 40px 32px}header{border-top:3px solid var(--ink);padding-top:18px;margin-bottom:34px}.meta, .card-head, .era, footer,.instruction{font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}.meta{display:flex;justify-content:space-between;gap:16px;color:var(--muted);text-transform:uppercase}h1{font:normal clamp(38px,5.5vw,66px)/1.05 Georgia,serif;letter-spacing:-.04em;margin:25px 0 12px}.summary{font-size:16px;margin:0;max-width:70ch}.instruction{color:var(--muted);margin:20px 0 0;letter-spacing:0}.cabinet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.specimen{min-width:0;border:1px solid var(--line);background:var(--card);padding:19px 23px 23px;animation:arrive .6s both;animation-delay:calc(var(--i)*65ms)}.card-head{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:19px}.number{color:var(--muted)}h2{font:inherit;font-weight:600;margin:0;letter-spacing:.03em}.state{position:relative;width:100%;display:block;text-align:left;border:0;background:none;padding:8px 10px;border-radius:2px;min-height:78px}.state:hover,.state[aria-expanded=true]{background:var(--tint)}.era{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.label{display:block;font:24px/1.15 Georgia,serif;margin-top:5px;overflow-wrap:anywhere}.after{border-left:2px solid var(--accent);background:var(--tint)}.after .label{color:var(--accent)}.connector{display:flex;align-items:center;gap:13px;width:100%;padding:4px 11px;border:0;background:transparent;text-align:left;min-height:64px}.connector span{font:11px/1.4 ui-monospace,monospace;color:var(--muted);border-bottom:1px dotted var(--line);overflow-wrap:anywhere}.connector:hover span,.connector[aria-expanded=true] span{color:var(--accent);border-color:var(--accent)}.connector svg{width:20px;height:54px;flex-shrink:0;overflow:visible;color:var(--accent)}.flow{animation:flow 3.8s linear infinite;animation-delay:calc(var(--i)*-.6s)}.unchanged{display:flex;align-items:baseline;flex-wrap:wrap;gap:14px 28px;margin-top:28px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.unchanged h2{font:12px ui-monospace,monospace;color:var(--muted)}.unchanged ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px 24px}.unchanged li{font-size:13px}.unchanged li::before{content:'=';color:var(--accent);margin-right:9px}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;color:var(--muted);margin-top:20px;letter-spacing:0}.detail{position:fixed;z-index:10;width:320px;max-width:calc(100vw - 24px);padding:20px;background:var(--card);border:1px solid var(--accent);box-shadow:0 10px 35px var(--shadow);max-height:70dvh;overflow:auto}.detail[hidden]{display:none}.detail h2{font:22px/1.2 Georgia,serif;padding-right:42px;margin:0 0 12px}.detail p{font-size:14px;line-height:1.5;margin:5px 0}.detail a{display:inline-block;color:var(--accent);font-size:12px;margin-top:12px;padding:5px 0}.close{position:absolute;right:7px;top:7px;background:transparent;border:0;min-height:44px;min-width:44px;font-size:22px}.detail:focus{outline:none}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes flow{0%{transform:translateY(0);opacity:0}15%,80%{opacity:.8}100%{transform:translateY(32px);opacity:0}}
@media(min-width:900px){.summary{white-space:nowrap}}
@media(max-width:850px){.cabinet{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:32px 24px}}
@media(max-width:540px){main{padding:24px 18px}.meta{font-size:10px;letter-spacing:.02em}h1{margin-top:24px}.cabinet{grid-template-columns:1fr;gap:15px}.specimen{padding:17px 20px}.card-head{margin-bottom:10px}.state{min-height:68px}.connector{min-height:55px}.connector svg{height:46px}.detail{width:auto;left:12px!important;right:12px;top:auto!important;bottom:12px}.summary{font-size:15px}.unchanged{align-items:flex-start;flex-direction:column;gap:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}.flow{opacity:.7}}
</style>
</head>
<body>
<!-- EDIT ONLY THIS JSON. No comments inside JSON. Escape embedded </script as <\/script.
Required: title, period, summary (one sentence), themes (3–6 objects).
Each theme: name, before, change, after. Each of those last three is
{ "label": "2–5 words", "detail": ["1–3 short plain-language lines"], "source": "optional https URL" }.
Optional: caption, footnote (short dry jokes), unchanged (short label array).
ui contains the exhibit and interaction labels; keep it when replacing example data.
No IDs, coordinates, HTML or layout settings needed. Theme order is reading order.
-->
<script id="diagram-data" type="application/json">
{
  "title": "Same Mac. New machinery.",
  "period": "2020–2023",
  "summary": "Apple replaced Intel chips across the Mac, changing how apps run and power is used.",
  "caption": "Exhibit: internal affairs.",
  "footnote": "Exterior: remarkably unalarmed.",
  "ui": {"collection":"Dully Labs / Transition cabinet", "before":"Before", "after":"After", "unchanged":"What stayed the same", "hint":"Inspect a label or arrow. Click to keep it open.", "close":"Close details", "source":"Source notes", "details":"Details"},
  "themes": [
    {
      "name":"The engine",
      "before":{"label":"Intel inside", "detail":["Intel supplied the Mac's main processor."], "source":"https://support.apple.com/en-us/116943"},
      "change":{"label":"Replace the foundation", "detail":["The first M1 Macs arrived in 2020.","The Mac Pro completed the lineup's switch in 2023."], "source":"https://www.apple.com/newsroom/2023/06/apple-unveils-new-mac-studio-and-brings-apple-silicon-to-mac-pro/"},
      "after":{"label":"Apple silicon inside", "detail":["Apple designed the main chips.","M1 combined processing, graphics and more in one chip."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"}
    },
    {
      "name":"Existing apps",
      "before":{"label":"Intel apps run directly", "detail":["Apps built for Intel ran on Intel processors."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"},
      "change":{"label":"Translate old instructions", "detail":["Rosetta 2 translated Intel app instructions for the new chips.","It gave developers time to update their apps."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"},
      "after":{"label":"Rosetta 2 bridges", "detail":["Many existing Intel apps could still run.","Translation did not guarantee every app would work."], "source":"https://support.apple.com/en-us/102527"}
    },
    {
      "name":"Shipping apps",
      "before":{"label":"Built for Intel", "detail":["Mac app releases targeted Intel processors."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"},
      "change":{"label":"Package both versions", "detail":["Developers could bundle code for both chip families.","These packages were called universal binaries."], "source":"https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary"},
      "after":{"label":"One app, both chips", "detail":["A universal app ran directly on either chip family.","Users did not need to choose a separate download."], "source":"https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary"}
    },
    {
      "name":"Away from outlets",
      "before":{"label":"Earlier battery limits", "detail":["The previous MacBook Air lasted less time in Apple's battery tests.","Results depend on what you do."], "source":"https://www.apple.com/newsroom/2020/11/introducing-the-next-generation-of-mac/"},
      "change":{"label":"Use less power", "detail":["M1 paired powerful cores with power-saving cores.","Light tasks could use less energy."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"},
      "after":{"label":"Longer between charges", "detail":["Apple rated the M1 Air for up to 18 hours of video playback.","That is a test result, not an all-day workload promise."], "source":"https://www.apple.com/newsroom/2020/11/introducing-the-next-generation-of-mac/"}
    },
    {
      "name":"Sharing memory",
      "before":{"label":"Separate graphics memory", "detail":["Intel Macs with separate graphics chips had separate graphics memory.","Intel models with built-in graphics already shared memory."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"},
      "change":{"label":"Share one pool", "detail":["Processing and graphics could use the same data.","Fewer copies were needed between memory pools."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"},
      "after":{"label":"Unified memory system", "detail":["M1's parts shared one fast memory pool."], "source":"https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/"}
    },
    {
      "name":"The Windows door",
      "before":{"label":"Boot into Windows", "detail":["Boot Camp let supported Intel Macs start in Windows.","Windows ran directly on the hardware."], "source":"https://support.apple.com/en-gb/102622"},
      "change":{"label":"Retire Boot Camp", "detail":["Boot Camp was for Intel Macs.","Apple silicon did not carry that route forward."], "source":"https://support.apple.com/guide/bootcamp-assistant/get-started-with-boot-camp-assistant-bcmp712cfeb8/6.1/mac/26"},
      "after":{"label":"No Windows dual boot", "detail":["Boot Camp could no longer start Windows.","Running Windows inside an app was a separate option."], "source":"https://support.microsoft.com/en-us/windows/options-for-using-windows-11-with-mac-computers-with-apple-m1-m2-and-m3-chips-cd15fd62-9b34-4b78-b0bc-121baa3c568c"}
    }
  ],
  "unchanged":["The macOS desktop", "Files and folders", "The Mac identity"]
}
</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('diagram-data').textContent);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  document.title = data.title;
  const main = el('main');
  const header = el('header');
  const meta = el('div', 'meta');
  meta.append(el('span', '', data.ui.collection), el('span', '', data.period));
  header.append(meta, el('h1', '', data.title), el('p', 'summary', data.summary), el('p', 'instruction', data.ui.hint));
  const grid = el('section', 'cabinet');
  grid.setAttribute('aria-label', data.title);
  const panel = el('aside', 'detail');
  panel.id = 'detail'; panel.hidden = true;
  panel.setAttribute('role', 'region');
  panel.setAttribute('aria-label', data.ui.details);
  let active = null, pinned = false, restoring = false, timer;
  function hide(restore = false) {
    clearTimeout(timer);
    const previous = active;
    if (active) active.setAttribute('aria-expanded', 'false');
    active = null; pinned = false; panel.hidden = true;
    if (restore && previous) { restoring = true; previous.focus({preventScroll:true}); restoring = false; }
  }
  function position() {
    if (!active || panel.hidden) return;
    const rect = active.getBoundingClientRect();
    const left = Math.max(12, Math.min(rect.left, innerWidth - panel.offsetWidth - 12));
    const top = rect.bottom + 6 + panel.offsetHeight <= innerHeight - 12 ? rect.bottom + 6 : Math.max(12, rect.top - panel.offsetHeight - 6);
    panel.style.left = left + 'px'; panel.style.top = top + 'px';
  }
  function show(button, item, pin) {
    clearTimeout(timer);
    if (pinned && !pin) return;
    if (active) active.setAttribute('aria-expanded', 'false');
    active = button; pinned = pin; button.setAttribute('aria-expanded', 'true');
    const close = el('button', 'close', '×');
    close.type = 'button'; close.setAttribute('aria-label', data.ui.close);
    close.addEventListener('click', () => hide(true));
    panel.replaceChildren(close, el('h2', '', item.label));
    item.detail.forEach(line => panel.append(el('p', '', line)));
    if (item.source) {
      const url = new URL(item.source);
      if (url.protocol === 'https:') {
        const link = el('a', '', data.ui.source);
        link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
        panel.append(link);
      }
    }
    panel.hidden = false; position();
    if (pin) close.focus({preventScroll:true});
  }
  function later() { clearTimeout(timer); timer = setTimeout(() => { if (!pinned && document.activeElement !== active && !panel.contains(document.activeElement)) hide(); }, 180); }
  function interactive(button, item, context) {
    button.type = 'button';
    button.setAttribute('aria-expanded', 'false');
    button.setAttribute('aria-controls', 'detail');
    button.setAttribute('aria-label', context + ': ' + item.label);
    button.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(button, item, false); });
    button.addEventListener('pointerleave', later);
    button.addEventListener('focus', () => { if (!restoring && active !== button) show(button, item, false); });
    button.addEventListener('blur', later);
    button.addEventListener('click', () => show(button, item, true));
    return button;
  }
  data.themes.forEach((theme, i) => {
    const card = el('article', 'specimen'); card.style.setProperty('--i', i);
    const head = el('div', 'card-head');
    head.append(el('span', 'number', String(i + 1).padStart(2, '0')), el('h2', '', theme.name));
    card.append(head);
    ['before', 'change', 'after'].forEach(key => {
      const item = theme[key];
      const button = el('button', key === 'change' ? 'connector' : 'state ' + key);
      if (key === 'change') {
        // Decorative geometry only; all labels and details come from the JSON.
        button.innerHTML = '<svg viewBox="0 0 20 54" aria-hidden="true"><path d="M10 3v46m-5-6 5 6 5-6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle class="flow" cx="10" cy="8" r="3" fill="currentColor"/></svg>';
        button.append(el('span', '', item.label));
      } else button.append(el('span', 'era', data.ui[key]), el('span', 'label', item.label));
      card.append(interactive(button, item, theme.name + ' / ' + (data.ui[key] || data.ui.details)));
    });
    grid.append(card);
  });
  main.append(header, grid);
  if (data.unchanged?.length) {
    const section = el('section', 'unchanged'), list = el('ul');
    data.unchanged.forEach(label => list.append(el('li', '', label)));
    section.append(el('h2', '', data.ui.unchanged), list); main.append(section);
  }
  if (data.caption || data.footnote) {
    const footer = el('footer');
    if (data.caption) footer.append(el('span', '', data.caption));
    if (data.footnote) footer.append(el('span', '', data.footnote));
    main.append(footer);
  }
  document.body.append(main, panel);
  panel.addEventListener('pointerenter', () => clearTimeout(timer));
  panel.addEventListener('pointerleave', later);
  panel.addEventListener('focusin', () => clearTimeout(timer));
  panel.addEventListener('focusout', e => { if (!panel.contains(e.relatedTarget)) later(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && active) { e.preventDefault(); hide(true); } });
  window.addEventListener('resize', position);
  window.addEventListener('scroll', position, {passive:true});
})();
</script>
</body>
</html>
