<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23426b35'/%3E%3Cpath d='M7 8h18v16H7zM7 14h18M13 8v16' fill='none' stroke='%23fffcf5' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--paper:#f5f2e9;--card:#fffcf5;--ink:#252c28;--muted:#62675e;--line:#d1d3c7;--accent:#426b35;--wash:#e6eddb;--shadow:#252c2820}
@media(prefers-color-scheme:dark){:root{--paper:#191d19;--card:#202620;--ink:#edece1;--muted:#adb5a6;--line:#414b3d;--accent:#b2cf8c;--wash:#303e29;--shadow:#0005}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}main{max-width:1100px;padding:44px 48px 32px;margin:auto}header{border-top:3px solid var(--ink);padding-top:18px}.eyebrow,.section-number,.stamp,th,footer{font:11px/1.6 ui-monospace,monospace;letter-spacing:.08em}.eyebrow{display:flex;justify-content:space-between;gap:16px;color:var(--muted)}h1{font:normal clamp(38px,6vw,64px)/1.08 Georgia,serif;letter-spacing:-.04em;margin:26px 0 18px;max-width:760px}.summary{max-width:740px;font-size:17px;margin:0 0 24px}.stats{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);padding:7px 12px;font-size:12px}.chip strong{font-weight:600;margin-right:7px}.section{margin-top:36px;border-top:1px solid var(--line);padding-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-title{display:flex;gap:13px;align-items:baseline}.section-number{color:var(--accent)}h2{font:normal 24px/1.2 Georgia,serif;margin:0}.legend{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.legend:before{content:'';width:8px;height:8px;background:var(--accent)}.flow{display:flex;align-items:center;padding:38px 0 25px}.node{flex:1;min-width:0;min-height:104px;border:1px solid var(--line);background:var(--card);padding:16px 12px;text-align:left;position:relative}.node.changed{border-top:3px solid var(--accent);background:var(--wash)}.node .stamp{display:block;color:var(--muted);margin-bottom:12px}.node .label{font-size:14px;font-weight:600}.edge{position:relative;flex:0 0 74px;height:70px;border:0;background:transparent;padding:0}.edge svg{width:100%;height:32px;display:block;overflow:visible;color:var(--muted)}.edge.changed svg{color:var(--accent)}.edge-label{display:block;font:10px/1.3 ui-monospace,monospace;letter-spacing:0;color:var(--muted);padding:0 2px}.dot{fill:var(--accent);animation:travel 4s linear infinite}.edge:nth-child(4) .dot{animation-delay:-2s}@keyframes travel{0%{transform:translateX(0);opacity:0}12%,85%{opacity:1}100%{transform:translateX(54px);opacity:0}}.caption{color:var(--muted);font:12px/1.6 ui-monospace,monospace;margin:0}.data-card{margin-top:20px;border:1px solid var(--line);background:var(--card)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}.toggle{display:flex;border:1px solid var(--line);padding:3px;gap:3px}.toggle button{min-height:38px;padding:6px 16px;border:0;background:transparent;font-size:12px}.toggle button[aria-pressed=true]{background:var(--ink);color:var(--paper)}.state-label{font:12px/1.5 ui-monospace,monospace;color:var(--muted)}table{border-collapse:collapse;width:100%;table-layout:fixed;text-align:left}th{color:var(--muted);font-weight:normal;padding:12px 20px;border-bottom:1px solid var(--line)}td{padding:14px 20px;border-bottom:1px solid var(--line);font:14px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}tbody tr:last-child td{border-bottom:0}.cell-change{background:var(--wash);color:var(--accent);box-shadow:inset 0 -2px var(--accent)}.data-note{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);margin:0}.checks{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin:18px 0 0}.checks li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;font-size:13px}.checks li:before{content:'';width:10px;height:10px;flex-shrink:0;border:1px solid var(--muted);margin-top:5px}footer{margin-top:30px;color:var(--muted)}.detail{position:fixed;z-index:5;width:min(340px,calc(100vw - 24px));padding:18px;background:var(--card);border:1px solid var(--accent);box-shadow:0 8px 32px var(--shadow)}.detail[hidden]{display:none}.detail h3{font:normal 22px/1.2 Georgia,serif;margin:0 45px 12px 0}.detail p{font-size:13px;line-height:1.5;margin:5px 0}.close{position:absolute;top:8px;right:8px;border:0;background:transparent;min-width:44px;min-height:44px;font-size:23px}.entrance{animation:enter .6s ease both}.section.entrance{animation-delay:.12s}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){main{padding:25px 22px}.flow{flex-direction:column;align-items:stretch;padding:26px 0 20px}.node{min-height:80px;padding:14px 18px}.node .stamp{margin-bottom:5px}.edge{flex-basis:70px;width:100%;height:70px}.edge svg{position:absolute;left:calc(50% - 35px);top:19px;width:70px;transform:rotate(90deg)}.edge-label{position:absolute;left:calc(50% + 20px);top:26px;max-width:calc(50% - 25px);text-align:left}.checks{grid-template-columns:1fr}.toolbar{padding:12px;gap:10px}.toggle button{padding:6px 12px}td,th{padding:12px 10px;font-size:12px}.summary{font-size:15px}.eyebrow{font-size:10px}h2{font-size:22px}.legend{font-size:10px}.data-note{padding:12px}.state-label{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.dot{display:none}}
</style>
</head>
<body>
<!-- EDIT ONLY THIS JSON. No HTML in values; escape < as \u003c.
 title/summary: heading + 1–2 sentences. exhibit/edition: small labels.
 stats: [{label,value}]. flow: ordered nodes [{label,kind,changed,details}].
 links: one per gap between flow nodes [{label,changed,details}]; direction is left to right, top to bottom on mobile.
 details: 1–3 short plain-language strings. Node/link labels: 2–5 words.
 sample: columns, rows [{id,before:[cells],after:[cells]}], beforeOrder/afterOrder (row IDs in display order), notes:[before,after].
 Both cell arrays match columns; changed cells are detected automatically.
 checks: short review strings. caption/footnote: optional dry remarks; omit or use "".
 ui: all interface labels; states contains exactly [before label,after label].
 Fictional example, not a real bank or PR. Replace all values to explain another PR.
-->
<script id="diagram-data" type="application/json">
{
  "title":"Two more digits. One less crisis.",
  "exhibit":"SYSTEMS COLLECTION / 01998",
  "edition":"Fictional PR · November 1998",
  "summary":"This PR widens years from YY to YYYY in two bank tables, fills in the missing centuries, and updates nightly interest and statements to use full dates.",
  "stats":[{"label":"Files","value":"6"},{"label":"Tables touched","value":"2"},{"label":"Risk","value":"Date assumptions"}],
  "flow":[
    {"label":"Account records","kind":"TABLE / 01","changed":true,"details":["Stores each account's opening date.","The year column grows from two digits to four.","Years below 50 become 2000–2049; the rest become 1950–1999."]},
    {"label":"Nightly interest","kind":"JOB / 02","changed":true,"details":["Reads opening dates to count interest days.","Uses full years when crossing into 2000.","Check a known balance across New Year's Eve."]},
    {"label":"Interest ledger","kind":"TABLE / 03","changed":true,"details":["Stores each interest payment and its date.","Its year column also grows to four digits.","Existing years use the same 1950–2049 window."]},
    {"label":"Statement report","kind":"REPORT / 04","changed":true,"details":["Reads dated interest payments from the ledger.","Orders by full year, then month and day.","Printed dates now show all four year digits."]}
  ],
  "links":[
    {"label":"Read dates","changed":true,"details":["The job now reads a four-digit year.","Update the reader before the first run on widened data."]},
    {"label":"Post interest","changed":true,"details":["New interest entries carry a full year.","A retry must not post the same payment twice."]},
    {"label":"Print entries","changed":true,"details":["The report receives four-digit years.","Check date order and printed column widths."]}
  ],
  "sample":{
    "columns":["Account","Opening date","Year stored"],
    "rows":[
      {"id":"A-104","before":["A-104","01-03-99","99"],"after":["A-104","01-03-1999","1999"]},
      {"id":"A-208","before":["A-208","12-31-00","00"],"after":["A-208","12-31-2000","2000"]},
      {"id":"A-312","before":["A-312","06-15-49","49"],"after":["A-312","06-15-2049","2049"]},
      {"id":"A-416","before":["A-416","02-01-50","50"],"after":["A-416","02-01-1950","1950"]}
    ],
    "beforeOrder":["A-208","A-312","A-416","A-104"],
    "afterOrder":["A-416","A-104","A-208","A-312"],
    "notes":["Sorted by YY, month, day: 00 comes before 99. Dates use MM-DD-YY; rows 49 and 50 test the boundary.","Sorted by YYYY, month, day. YY < 50 → 20YY; otherwise → 19YY. This assumes every date belongs in 1950–2049."]
  },
  "checks":["Confirm all source dates belong in 1950–2049.","Test 49 → 2049, 50 → 1950, and leap day 2000.","Reconcile row counts and balances after filling years.","Check retries, rollout order, and a restore rehearsal."],
  "caption":"Condition: century not included.",
  "footnote":"The calendar has declined to postpone.",
  "ui":{"overview":"What this PR does","flow":"Follow the dates","changed":"Changed in this PR","sample":"See the data","review":"Things to check","states":["Before","After"],"stateNotes":["Two-digit years","Four-digit years"],"close":"Close details","changedCells":"Highlighted cells change","motion":"Pause motion","resume":"Resume motion"}
}
</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('diagram-data').textContent);
document.title=data.title;
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const main=el('main');document.body.append(main);
const header=el('header','entrance');main.append(header);
const eyebrow=el('div','eyebrow');eyebrow.append(el('span','',data.exhibit),el('span','',data.edition));header.append(eyebrow,el('h1','',data.title));
header.append(el('h2','',data.ui.overview),el('p','summary',data.summary));
const stats=el('div','stats');data.stats.forEach(s=>{const chip=el('span','chip');chip.append(el('strong','',s.value),document.createTextNode(s.label));stats.append(chip);});header.append(stats);
function section(number,title){const s=el('section','section entrance'),head=el('div','section-head'),name=el('div','section-title');const h=el('h2','',title);h.id='section-'+number;s.setAttribute('aria-labelledby',h.id);name.append(el('span','section-number',number),h);head.append(name);s.append(head);main.append(s);return {s,head};}
const detail=el('aside','detail');detail.id='detail';detail.hidden=true;detail.setAttribute('role','region');detail.setAttribute('aria-label',data.ui.flow);
const close=el('button','close','×');close.type='button';close.setAttribute('aria-label',data.ui.close);
const detailTitle=el('h3'),detailBody=el('div');detailBody.id='detail-body';detail.append(close,detailTitle,detailBody);document.body.append(detail);
let active=null,pinned=false,timer,suppress=false;
function position(){if(!active)return;const r=active.getBoundingClientRect();const x=Math.max(12,Math.min(r.left,innerWidth-detail.offsetWidth-12));const y=r.bottom+8+detail.offsetHeight<innerHeight?r.bottom+8:Math.max(12,r.top-detail.offsetHeight-8);detail.style.left=x+'px';detail.style.top=y+'px';detail.style.maxHeight=(innerHeight-24)+'px';detail.style.overflowY='auto';}
function hide(restore=false){clearTimeout(timer);const old=active;if(old){old.setAttribute('aria-expanded','false');old.removeAttribute('aria-describedby');}detail.hidden=true;active=null;pinned=false;if(restore&&old){suppress=true;old.focus();suppress=false;}}
function show(button,item,pin=false){if(suppress||(pinned&&!pin))return;clearTimeout(timer);if(active&&active!==button)active.setAttribute('aria-expanded','false');if(active)active.removeAttribute('aria-describedby');active=button;pinned=pin;detailTitle.textContent=item.label;detailBody.replaceChildren(...item.details.map(t=>el('p','',t)));detail.hidden=false;button.setAttribute('aria-expanded','true');button.setAttribute('aria-describedby','detail-body');position();}
function delayedHide(){clearTimeout(timer);timer=setTimeout(()=>{if(!pinned&&!detail.matches(':hover')&&!detail.contains(document.activeElement)&&active!==document.activeElement)hide();},250);}
function interactive(button,item){button.type='button';button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls','detail');button.setAttribute('aria-label',item.label+(item.changed?' · '+data.ui.changed:''));button.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show(button,item);});button.addEventListener('pointerleave',delayedHide);button.addEventListener('focus',()=>show(button,item));button.addEventListener('blur',delayedHide);button.addEventListener('click',()=>show(button,item,true));}
close.addEventListener('click',()=>hide(true));detail.addEventListener('pointerenter',()=>clearTimeout(timer));detail.addEventListener('pointerleave',delayedHide);detail.addEventListener('focusout',delayedHide);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!detail.hidden){e.preventDefault();hide(detail.contains(document.activeElement));}});window.addEventListener('resize',position);window.addEventListener('scroll',position,{passive:true});
const flowSection=section('01',data.ui.flow);flowSection.head.append(el('span','legend',data.ui.changed));const flow=el('div','flow');flowSection.s.append(flow);
data.flow.forEach((item,i)=>{const node=el('button','node'+(item.changed?' changed':''));node.append(el('span','stamp',item.kind),el('span','label',item.label));interactive(node,item);flow.append(node);if(i<data.flow.length-1){const link=data.links[i],edge=el('button','edge'+(link.changed?' changed':''));edge.innerHTML='<svg viewBox="0 0 74 32" aria-hidden="true"><path d="M4 16H66M60 11L66 16L60 21" fill="none" stroke="currentColor"/><circle class="dot" cx="8" cy="16" r="2.5"/></svg>';edge.append(el('span','edge-label',link.label));interactive(edge,link);flow.append(edge);}});
if(data.caption)flowSection.s.append(el('p','caption',data.caption));
const sampleSection=section('02',data.ui.sample);const card=el('div','data-card'),toolbar=el('div','toolbar'),toggle=el('div','toggle'),stateLabel=el('span','state-label');toggle.setAttribute('role','group');toggle.setAttribute('aria-label',data.ui.sample);toolbar.append(toggle,stateLabel);card.append(toolbar);
const table=el('table');table.setAttribute('aria-label',data.ui.sample);const thead=el('thead'),headRow=el('tr');data.sample.columns.forEach(c=>{const th=el('th','',c);th.scope='col';headRow.append(th);});thead.append(headRow);const tbody=el('tbody');table.append(thead,tbody);card.append(table);const note=el('p','data-note');note.setAttribute('aria-live','polite');card.append(note);sampleSection.s.append(card);sampleSection.head.append(el('span','legend',data.ui.changedCells));
const buttons=data.ui.states.map((label,i)=>{const b=el('button','',label);b.type='button';b.addEventListener('click',()=>renderRows(i));toggle.append(b);return b;});
function renderRows(state){buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state)));stateLabel.textContent=data.ui.stateNotes[state];note.textContent=data.sample.notes[state];tbody.replaceChildren();const key=state?'after':'before';data.sample[key+'Order'].forEach(id=>{const row=data.sample.rows.find(r=>r.id===id),tr=el('tr');row[key].forEach((value,i)=>{const changed=row.before[i]!==row.after[i];const cell=el('td',changed?'cell-change':'',value);tr.append(cell);});tbody.append(tr);});}
renderRows(0);
const review=section('03',data.ui.review),list=el('ul','checks');data.checks.forEach(t=>list.append(el('li','',t)));review.s.append(list);
const footer=el('footer');if(data.footnote)footer.append(el('span','',data.footnote));const motion=el('button','chip',data.ui.motion);motion.type='button';motion.style.cssText='float:right;background:transparent;margin-left:12px';motion.setAttribute('aria-pressed','false');motion.addEventListener('click',()=>{const paused=motion.getAttribute('aria-pressed')!=='true';motion.setAttribute('aria-pressed',String(paused));motion.textContent=paused?data.ui.resume:data.ui.motion;document.querySelectorAll('.dot').forEach(d=>d.style.animationPlayState=paused?'paused':'running');});footer.append(motion);main.append(footer);
</script>
</body>
