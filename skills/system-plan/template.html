<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232f6452'/%3E%3Cpath d='M5 9h6v14H5zM13 6h6v20h-6zM21 9h6v14h-6z' fill='none' stroke='%23f5f2ea' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
/* Shared tokens and base: identical in all four diagram-kit templates. */
:root{color-scheme:light dark;--paper:#f5f2ea;--card:#fdfbf5;--ink:#272b26;--muted:#656a60;--line:#cecfc3;--accent:#2f6452;--wash:#e6ede4;--shadow:#272b2622;--serif:Georgia,serif;--sans:system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--gap:16px;--pad:20px;--radius:2px;--fast:.18s;--slow:.5s}
@media(prefers-color-scheme:dark){:root{--paper:#191d1a;--card:#212722;--ink:#eeebe0;--muted:#abb2a5;--line:#444d44;--accent:#9bcab0;--wash:#2c3b31;--shadow:#0006}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
main{max-width:1080px;margin:auto;padding:48px 32px 32px}
main>*{animation:arrive var(--slow) both}
.box,.arrow{animation:arrive .7s ease-out both;animation-delay:calc(150ms + var(--i,0)*120ms)}
header{border-top:3px solid var(--ink);padding-top:var(--gap);margin-bottom:32px}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px var(--gap)}
.eyebrow,.hint,.caption,.tag,.arrow,footer{font:11px/1.5 var(--mono);letter-spacing:.05em;color:var(--muted);margin:0}
.eyebrow,.tag{text-transform:uppercase}
.eyebrow{color:var(--accent)}
.tag{display:block;margin-bottom:4px}
h1{font:normal clamp(32px,6vw,56px)/1.08 var(--serif);letter-spacing:-.03em;margin:20px 0 10px}
h2.tag{margin-bottom:10px}
.summary{margin:0 0 10px;max-width:60ch}
button{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.box{display:block;width:100%;padding:14px var(--pad);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);font:18px/1.25 var(--serif);overflow-wrap:anywhere;transform:perspective(800px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg));transition:border-color var(--fast),background var(--fast),transform var(--fast)}
.box:hover,.box[aria-expanded=true]{border-color:var(--accent);background:var(--wash)}
.arrow{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px var(--pad);border:0;background:none;transition:color var(--fast)}
.arrow::before{content:'↓';font-size:16px;color:var(--accent)}
.arrow:hover,.arrow[aria-expanded=true]{color:var(--accent)}
footer{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:32px;padding-top:var(--gap);border-top:1px solid var(--line)}
footer a{color:inherit;text-underline-offset:3px}
.detail{position:fixed;z-index:9;width:min(300px,calc(100vw - 24px));padding:var(--gap) var(--pad);background:color-mix(in srgb,var(--card) 70%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:0 8px 28px var(--shadow),inset 0 1px 1px #fff3;pointer-events:none;animation:arrive var(--fast)}
.detail[hidden]{display:none}
.detail h2{font:normal 20px/1.2 var(--serif);margin:0 28px 6px 0}
.detail p{margin:0;font-size:14px;white-space:pre-line}
.close{display:none;position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;font-size:20px;text-align:center}
.pinned{pointer-events:auto}
.pinned .close{display:block}
@keyframes arrive{from{opacity:0;translate:0 12px}}
@media(max-width:600px){main{padding:24px 16px}.detail{width:calc(100vw - 24px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* This template only. */
.board{position:relative;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:72px;align-items:start}
.lane,.shell,.parts{display:grid;gap:20px;min-width:0}
.lane h2{margin:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.shell{padding:12px;border:1px dashed var(--accent);border-radius:var(--radius)}
.parts{padding-left:20px}
.on{border-color:var(--accent);background:var(--wash)}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--accent);stroke-width:1.4}
.wires marker path{fill:var(--accent);stroke:none}
.wire-label{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:5px 8px;background:var(--paper);border:1px solid var(--accent);border-radius:var(--radius);font:11px/1.4 var(--mono);color:var(--accent);white-space:nowrap}
.wire-label.tagged{transform:translateY(-50%)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--gap);margin-top:40px}
.plan h2{grid-column:1/-1;margin:0}
@media(max-width:760px){.board{grid-template-columns:1fr;gap:28px;padding-left:20px}}
</style>
</head>
<body>
<!-- EDIT ONLY THIS JSON. Plain text, no HTML. Labels: 2–5 words. Details: 1–3 short plain lines, split with \n.
{title, eyebrow, nodes: [{id, lane, label, detail}], edges: [{from, to, label, detail}], plan: [{label, detail, boxes?}]}
lane: upstream | system | internal | downstream. Exactly one system node; internal nodes are its parts. Up to 4 per lane.
edges use node ids and stay hidden until their box is hovered. plan: 3–5 steps; boxes lists the node ids a step touches.
caption, footnote, sources [{label, url}] are optional. -->
<script id="diagram-data" type="application/json">
{
  "title": "Counting a country",
  "eyebrow": "US Census · 1890",
  "caption": "Storage medium: cardboard.",
  "footnote": "Please do not fold, spindle or mutilate the exhibit.",
  "sources": [
    {"label": "Census Bureau · the machine", "url": "https://www.census.gov/about/history/bureau-history/census-innovations/technology/hollerith-machine.html"}
  ],
  "nodes": [
    {"id": "schedules", "lane": "upstream", "label": "Census schedules", "detail": "Paper forms filled in door to door."},
    {"id": "office", "lane": "upstream", "label": "Census Office", "detail": "Decides which totals to count."},
    {"id": "stock", "lane": "upstream", "label": "Blank cards", "detail": "Card stock cut to fit the punch and the reader."},
    {"id": "system", "lane": "system", "label": "Hollerith tabulating system", "detail": "Counts people by reading holes in cards with electricity."},
    {"id": "punch", "lane": "internal", "label": "Pantograph punch", "detail": "A clerk turns one person's answers into holes in one card."},
    {"id": "reader", "lane": "internal", "label": "Card reader", "detail": "Pins drop through the holes into cups of mercury.\nEach one closes a circuit."},
    {"id": "dials", "lane": "internal", "label": "Dial counters", "detail": "Each closed circuit moves a dial forward by one."},
    {"id": "sort", "lane": "internal", "label": "Sorting box", "detail": "A lid pops open.\nThe clerk drops the card in by hand."},
    {"id": "congress", "lane": "downstream", "label": "House seats", "detail": "Congress divides seats among the states by population."},
    {"id": "reports", "lane": "downstream", "label": "Census reports", "detail": "Printed volumes of tables."},
    {"id": "news", "lane": "downstream", "label": "Newspapers", "detail": "Print the totals for everyone else."}
  ],
  "edges": [
    {"from": "schedules", "to": "system", "label": "Written answers", "detail": "Each person's answers are copied onto one card."},
    {"from": "office", "to": "system", "label": "What to count", "detail": "The office names the totals it needs."},
    {"from": "stock", "to": "system", "label": "Blank cards", "detail": "One card per person: about 63 million."},
    {"from": "system", "to": "congress", "label": "State totals", "detail": "Population by state decides each state's seats."},
    {"from": "system", "to": "reports", "label": "Finished tables", "detail": "Clerks copy the dial readings into tables for print."},
    {"from": "system", "to": "news", "label": "Released figures", "detail": "Papers print the totals as they come out."},
    {"from": "punch", "to": "reader", "label": "Punched cards", "detail": "Fed in by hand, one at a time."},
    {"from": "reader", "to": "dials", "label": "Electric pulses", "detail": "One pulse for each hole read."},
    {"from": "reader", "to": "sort", "label": "Which lid", "detail": "The circuit picks the lid that opens."},
    {"from": "sort", "to": "reader", "label": "Second pass", "detail": "Sorted piles go through again for finer counts."}
  ],
  "plan": [
    {"label": "Punch the cards", "detail": "Copy every person on the schedules onto a card.", "boxes": ["schedules", "stock", "punch"]},
    {"label": "Count the holes", "detail": "Feed the cards through. The dials add up.", "boxes": ["reader", "dials"]},
    {"label": "Sort and recount", "detail": "Regroup the cards to count combinations, such as age by state.", "boxes": ["sort", "reader"]},
    {"label": "Publish the totals", "detail": "Copy the dial readings into tables and send them to print.", "boxes": ["office", "reports", "congress", "news"]}
  ]
}
</script>
<script>
(()=>{
'use strict';
// Forgive trailing commas; if the JSON is still broken, say so on the page instead of showing nothing.
let data;
try{data=JSON.parse(document.getElementById('diagram-data').textContent.replace(/,(\s*[}\]])/g,'$1'))}
catch(e){const p=document.createElement('pre');p.style.cssText='margin:24px;white-space:pre-wrap;font:14px/1.5 ui-monospace,monospace;color:#b3261e';p.textContent='This diagram could not load: the JSON in <script id="diagram-data"> is broken.\n'+e.message+'\nCheck for a missing comma, quote or bracket near that spot.';document.body.append(p);return}
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n};
document.title=data.title;
const main=el('main'),header=el('header'),bar=el('div','bar'),footer=el('footer');
bar.append(el('p','eyebrow',data.eyebrow),el('p','hint','Hover to inspect · tap to pin'));
header.append(bar,el('h1','',data.title));
if(data.summary)header.append(el('p','summary',data.summary));
if(data.caption)header.append(el('p','caption',data.caption));
if(data.footnote)footer.append(el('span','',data.footnote));
(data.sources||[]).forEach(s=>{if(/^https:\/\//.test(s.url)){const a=el('a','',s.label);a.href=s.url;footer.append(a)}});

// One popover for boxes and arrows: hover or focus shows, click or Enter pins, Esc or × closes.
const pop=el('aside','detail'),popTitle=el('h2'),popBody=el('p'),closer=el('button','close','×');
pop.id='detail';pop.hidden=true;closer.type='button';closer.setAttribute('aria-label','Close');pop.append(popTitle,popBody,closer);
let active=null,pinned=false,timer,quiet=false;
function place(){
  if(!active)return;
  const r=active.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight,fitY=y=>Math.max(12,Math.min(y,innerHeight-h-12));
  let x=Math.max(12,Math.min(r.left,innerWidth-w-12)),y=r.bottom+8+h<=innerHeight-12?r.bottom+8:fitY(r.top-h-8);
  if(innerWidth<600)y=r.bottom>innerHeight-h-24?12:innerHeight-h-12; // phone: dock away from the target
  else if(active.closest('.stack')){ // vertical stacks: open beside, so the next item stays visible
    const right=r.right+8,left=r.left-w-8;
    if(right+w<=innerWidth-12){x=right;y=fitY(r.top)}else if(left>=12){x=left;y=fitY(r.top)}
  }
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function release(btn){btn.setAttribute('aria-expanded','false');btn.removeAttribute('aria-describedby')}
function hide(refocus){
  clearTimeout(timer);
  const old=active;
  if(!old)return;
  release(old);active=null;pinned=false;pop.hidden=true;connect(null);
  if(refocus){quiet=true;old.focus();quiet=false}
}
function show(btn,item,pin){
  if(quiet||(pinned&&!pin))return;
  clearTimeout(timer);
  if(active)release(active);
  active=btn;pinned=pin;
  btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-describedby','detail');
  popTitle.textContent=item.label;popBody.textContent=item.detail;
  pop.classList.toggle('pinned',pin);pop.hidden=false;place();connect(btn);
}
function later(){clearTimeout(timer);timer=setTimeout(()=>{if(!pinned&&!board.matches(':hover'))hide()},200)}
function tip(btn,item){
  btn.type='button';btn.setAttribute('aria-expanded','false');
  btn.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show(btn,item,false)});
  btn.addEventListener('pointerleave',later);
  btn.addEventListener('focus',()=>show(btn,item,false));
  btn.addEventListener('blur',later);
  btn.addEventListener('click',()=>active===btn&&pinned?hide():show(btn,item,true));
  if(btn.classList.contains('box')&&!matchMedia('(prefers-reduced-motion:reduce)').matches){ // gentle 3D tilt toward the pointer
    btn.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=btn.getBoundingClientRect();btn.style.setProperty('--rx',((e.clientX-r.left)/r.width-.5)*4+'deg');btn.style.setProperty('--ry',(.5-(e.clientY-r.top)/r.height)*4+'deg')});
    btn.addEventListener('pointerleave',()=>{btn.style.removeProperty('--rx');btn.style.removeProperty('--ry')});
  }
  return btn;
}
closer.addEventListener('click',()=>hide(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide(true)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest?.('.detail,[aria-expanded]'))hide()});
addEventListener('resize',place);addEventListener('scroll',place,{passive:true});

const board=el('section','board'),plan=el('section','plan'),shell=el('div','shell'),parts=el('div','parts stack'),boxes={},lanes={system:shell,internal:parts};
[['upstream','Upstream'],['system','Our system'],['downstream','Downstream']].forEach(([key,name])=>{
  const lane=el('div','lane');
  lane.append(el('h2','tag',name));board.append(lane);
  if(lanes[key])lane.append(shell);else lanes[key]=lane;
});
(data.nodes||[]).forEach(n=>{
  const b=tip(el('button','box',n.label),n);
  b.dataset.id=n.id;boxes[n.id]=b;
  (lanes[n.lane]||lanes.upstream).append(b); // unknown lane: show it rather than crash
});
plan.append(el('h2','tag','The plan'));
shell.append(parts);
(data.plan||[]).forEach((s,i)=>{
  const b=el('button','box');
  b.append(el('span','tag',String(i+1).padStart(2,'0')),s.label);b.lit=s.boxes||[];plan.append(tip(b,s));
});

// Connections: hidden at rest, drawn only for the box that is hovered, focused or pinned.
const wires=document.createElementNS('http://www.w3.org/2000/svg','svg');
wires.setAttribute('class','wires');wires.setAttribute('aria-hidden','true');
wires.innerHTML='<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z"/></marker><g/>';
board.append(wires);
let current=null,lit=[];
function connect(btn){
  if(btn&&btn.classList.contains('wire-label'))return;
  current=btn&&btn.dataset.id||null;lit=btn&&btn.lit||[];draw();
}
function draw(){
  wires.lastChild.replaceChildren();
  board.querySelectorAll('.wire-label').forEach(n=>n.remove());
  for(const id in boxes)boxes[id].classList.toggle('on',id===current||lit.includes(id));
  if(!current)return;
  const o=board.getBoundingClientRect(),tagged={},labels=[];
  (data.edges||[]).filter(e=>(e.from===current||e.to===current)&&boxes[e.from]&&boxes[e.to]).forEach(e=>{
    const a=boxes[e.from].getBoundingClientRect(),b=boxes[e.to].getBoundingClientRect();
    const ay=a.top+a.height/2-o.top,by=b.top+b.height/2-o.top,label=tip(el('button','wire-label',e.label),e);
    let ax,bx,bend;
    if(a.right<b.left||b.right<a.left){
      // Side by side: curve across the gap, label on the far box's top edge so labels never stack.
      const t=e.from===current?b:a;
      ax=(a.right<b.left?a.right:a.left)-o.left;bx=(a.right<b.left?b.left:b.right)-o.left;bend=(ax+bx)/2;
      label.style.left=t.left+t.width/2-o.left+'px';label.style.top=t.top-o.top+'px';
    }else{
      // Stacked: curve down the left side, label tagged onto the other box.
      const otherId=e.from===current?e.to:e.from,t=e.from===current?b:a;
      ax=a.left-o.left;bx=b.left-o.left;bend=Math.min(ax,bx)-18;
      label.classList.add('tagged');
      label.style.left=t.left-o.left+12+'px';label.style.top=(tagged[otherId]?t.bottom:t.top)-o.top+'px';tagged[otherId]=true;
    }
    const path=document.createElementNS(wires.namespaceURI,'path');
    path.setAttribute('d','M'+ax+' '+ay+'C'+bend+' '+ay+' '+bend+' '+by+' '+bx+' '+by);
    path.setAttribute('marker-end','url(#head)');
    wires.lastChild.append(path);labels.push(label);
  });
  boxes[current].after(...labels);
}
board.addEventListener('pointerleave',later);
new ResizeObserver(draw).observe(board);
main.append(header,board,plan,footer);document.body.append(main,pop);
main.querySelectorAll('.box,.arrow').forEach((n,i)=>n.style.setProperty('--i',Math.min(i,12))); // staggered entrance
})();
</script>
</body>
</html>
